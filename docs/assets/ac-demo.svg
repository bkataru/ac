<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="564" viewBox="0 0 820 564" role="img" aria-label="ac demo: infix arithmetic, scale, hex output, math library, factorial, and RPN macros">
  <title>ac demo</title>
  <rect width="100%" height="100%" rx="8" ry="8" fill="#121314"/>
  <path d="M0,8 a8,8 0 0 1 8,-8 h804 a8,8 0 0 1 8,8 v24 h-820 z" fill="#1c1d1f"/>
  <circle cx="22" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="16" r="5" fill="#27c93f"/>
  <text x="410" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">ac</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
    <text x="18" y="60" fill="#d4d4d4"><tspan fill="#6ea8fe">ac</tspan><tspan fill="#d4d4d4"> v0.1.0 - A Calculator</tspan></text>
    <text x="18" y="78" fill="#d4d4d4"><tspan fill="#8b949e">Type :help for help, :quit to exit</tspan></text>
    <text x="18" y="96" fill="#d4d4d4"><tspan fill="#d4d4d4"></tspan></text>
    <text x="18" y="114" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">1 + 2 * 3</tspan></text>
    <text x="18" y="132" fill="#d4d4d4"><tspan fill="#dcdcaa">7</tspan></text>
    <text x="18" y="150" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">scale = 20</tspan></text>
    <text x="18" y="168" fill="#d4d4d4"><tspan fill="#dcdcaa">20</tspan></text>
    <text x="18" y="186" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">1 / 3</tspan></text>
    <text x="18" y="204" fill="#d4d4d4"><tspan fill="#dcdcaa">0.33333333333333333333</tspan></text>
    <text x="18" y="222" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">2 ^ 64</tspan></text>
    <text x="18" y="240" fill="#d4d4d4"><tspan fill="#dcdcaa">18446744073709551616</tspan></text>
    <text x="18" y="258" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">obase = 16</tspan></text>
    <text x="18" y="276" fill="#d4d4d4"><tspan fill="#dcdcaa">10</tspan></text>
    <text x="18" y="294" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">255</tspan></text>
    <text x="18" y="312" fill="#d4d4d4"><tspan fill="#dcdcaa">FF</tspan></text>
    <text x="18" y="330" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">pi()</tspan></text>
    <text x="18" y="348" fill="#d4d4d4"><tspan fill="#dcdcaa">3.14159265358979323846</tspan></text>
    <text x="18" y="366" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">j(0, 1)</tspan></text>
    <text x="18" y="384" fill="#d4d4d4"><tspan fill="#dcdcaa">0.76519768655796655144</tspan></text>
    <text x="18" y="402" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">fact(25)</tspan></text>
    <text x="18" y="420" fill="#d4d4d4"><tspan fill="#dcdcaa">15511210043330985984000000</tspan></text>
    <text x="18" y="438" fill="#d4d4d4"><tspan fill="#4ec94e">ac&gt; </tspan><tspan fill="#d4d4d4">:rpn</tspan></text>
    <text x="18" y="456" fill="#d4d4d4"><tspan fill="#d4d4d4">Switched to RPN mode</tspan></text>
    <text x="18" y="474" fill="#d4d4d4"><tspan fill="#4eccdc">dc&gt; </tspan><tspan fill="#d4d4d4">100 8 7 | p</tspan></text>
    <text x="18" y="492" fill="#d4d4d4"><tspan fill="#dcdcaa">4</tspan></text>
    <text x="18" y="510" fill="#d4d4d4"><tspan fill="#4eccdc">dc&gt; </tspan><tspan fill="#d4d4d4">[2 3 +] x p</tspan></text>
    <text x="18" y="528" fill="#d4d4d4"><tspan fill="#dcdcaa">5</tspan></text>
    <text x="18" y="546" fill="#d4d4d4"><tspan fill="#4eccdc">dc&gt; </tspan><tspan fill="#d4d4d4">:quit</tspan></text>
  </g>
</svg>
